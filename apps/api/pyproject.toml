[project]
name = "api"
version = "0.1.0"
description = "FireFusion FastAPI Backend - NASA Space Apps Challenge 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.49",
    "alembic>=1.20.1",
    "duckdb>=2.0.0",
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "duckdb-engine>=0.17.0",
    "pyarrow>=26.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
