/* ---------- Design tokens ---------- */
:root{
  color-scheme:dark;
  --ink:#f4f7f4;
  --muted:#a7b8b6;
  --soft:#7f9492;
  --teal:#7fe0d2;
  --teal-dim:rgba(127,224,210,.16);
  --orange:#ff8a4d;
  --orange-2:#ffb27a;
  --amber:#ffab58;
  --high:#fc684c;
  --nominal:#ffab58;
  --low:#f0d57f;
  --line:rgba(219,240,233,.14);
  --line-strong:rgba(228,246,240,.22);
  --surface:linear-gradient(155deg,rgba(16,32,34,.93),rgba(8,19,24,.93));
  --surface-shadow:0 18px 48px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  --glass-blur:blur(22px) saturate(1.4);
  --drawer-width:352px;
  --r-chip:8px;
  --r-control:12px;
  --r-card:16px;
  --r-sheet:18px;
  --shadow-chip:0 10px 26px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06);
  --shadow-card:0 20px 55px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.07);
  --shadow-drawer:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 60px rgba(53,203,234,.05);
  --ease:cubic-bezier(.22,1,.36,1);
  --focus:0 0 0 2px #071419,0 0 0 4.5px var(--teal);
}

/* ---------- Reset &amp; base ---------- */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071317}
body{font-family:&quot;Inter&quot;,&quot;Segoe UI&quot;,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:&quot;cv11&quot;,&quot;ss01&quot;}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px;box-shadow:0 0 0 5px rgba(127,224,210,.16)}
[hidden]{display:none !important}
.sr-only{position:absolute !important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.skip-link{position:absolute;top:10px;left:10px;z-index:100;padding:9px 14px;border-radius:8px;background:var(--teal);color:#06231f;font-size:12px;font-weight:800;text-decoration:none;transform:translateY(-160%);transition:transform .25s var(--ease)}
.skip-link:focus-visible{transform:translateY(0);outline:none;box-shadow:var(--focus)}
.noscript-note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;padding:10px 16px;border-radius:8px;background:#2a1712;border:1px solid rgba(255,150,110,.4);color:#ffd9c4;font-size:12px}

/* ---------- App &amp; map stage ---------- */
.app{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:radial-gradient(120% 90% at 50% 30%,#0f1e22 0%,#080f12 62%,#060b0d 100%)}
.external-only{display:none}
.app[data-mode=&quot;external&quot;] .external-only{display:inline}
.app[data-mode=&quot;external&quot;] .sample-only{display:none !important}

.map-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.map-stage.is-dragging{cursor:grabbing}
.map-world{position:absolute;will-change:transform;transform-origin:center center;touch-action:none}

.cluster-layer,.detection-layer{pointer-events:none}
.cluster-layer{z-index:2}
.detection-layer{z-index:3}
.cluster-heat,.cluster-outline,.cluster-pin,.detection-dot{position:absolute}
.cluster-heat{width:142px;height:142px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,128,63,.13) 0%,rgba(255,128,63,.055) 31%,rgba(255,128,63,0) 69%);mix-blend-mode:screen;pointer-events:none;opacity:.72}
.cluster-outline{pointer-events:none;overflow:visible}
.cluster-outline svg{width:100%;height:100%;overflow:visible}
.cluster-outline path{fill:rgba(255,153,84,.035);stroke:rgba(255,190,133,.6);stroke-width:1.25;stroke-dasharray:5 5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cluster-pin{z-index:4;width:34px;height:34px;display:grid;place-items:center;transform:translate(-50%,-50%);border:1.5px solid rgba(255,222,190,.94);border-radius:50%;background:linear-gradient(145deg,#ffb76d,#e96839);color:#24150e;font-family:&quot;Space Grotesk&quot;,&quot;Inter&quot;,sans-serif;font-size:12px;font-weight:700;line-height:1;box-shadow:0 2px 0 rgba(20,16,11,.35),0 0 0 3px rgba(255,155,83,.16),0 8px 19px rgba(0,0,0,.42);pointer-events:auto;cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease),filter .18s var(--ease)}
.cluster-pin:hover,.cluster-pin:focus-visible{transform:translate(-50%,-50%) scale(1.12);filter:brightness(1.08);box-shadow:0 0 0 5px rgba(255,173,107,.24),0 10px 24px rgba(0,0,0,.46)}
.cluster-pin.selected{width:38px;height:38px;border:2px solid #fff4e5;background:linear-gradient(145deg,#ffca83,#ff7843);box-shadow:0 0 0 5px rgba(255,156,82,.26),0 0 0 12px rgba(255,156,82,.10),0 8px 25px rgba(0,0,0,.55);animation:cluster-select-in .32s var(--ease) both}
.cluster-pin.selected span{display:none}
.cluster-pin.selected::after{content:&quot;&quot;;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
@keyframes cluster-select-in{from{transform:translate(-50%,-50%) scale(.72);filter:brightness(1.35)}to{transform:translate(-50%,-50%) scale(1);filter:brightness(1)}}
.detection-dot{z-index:3;display:grid;place-items:center;width:26px;height:26px;padding:0;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;box-shadow:none;pointer-events:auto;cursor:pointer}
.detection-dot-core{display:block;width:var(--dot,9px);height:var(--dot,9px);border:1px solid rgba(255,250,236,.88);border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),var(--dot-color,#ff9a55);box-shadow:0 0 0 1px rgba(20,16,12,.5),0 1px 4px rgba(0,0,0,.6);transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.detection-dot:hover .detection-dot-core,.detection-dot:focus-visible .detection-dot-core{transform:scale(1.6);box-shadow:0 0 0 3px rgba(255,248,236,.3),0 0 12px 3px var(--dot-glow,rgba(255,120,55,.65))}
.map-world.raw-mode .cluster-heat,.map-world.raw-mode .cluster-outline,.map-world.raw-mode .cluster-pin{display:none}

/* ---------- Callout &amp; connector ---------- */
.callout-connector{position:absolute;inset:0;z-index:5;width:100%;height:100%;overflow:visible;pointer-events:none}
.callout-connector path{fill:none;stroke:rgba(255,205,155,.95);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:4 6;animation:connector-flow 1.15s linear infinite;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
@keyframes connector-flow{to{stroke-dashoffset:-11}}
.incident-callout{position:absolute;z-index:8;width:284px;min-height:153px;padding:15px 16px 13px;border:1px solid var(--line-strong);border-radius:16px;background:linear-gradient(135deg,rgba(20,32,34,.97),rgba(8,20,25,.97));box-shadow:0 22px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);cursor:default;user-select:text}
.incident-callout::before{content:&quot;&quot;;position:absolute;top:18px;bottom:18px;left:0;width:2px;border-radius:2px;background:linear-gradient(#ffb36d,#f35a36)}
.callout-kicker{display:flex;align-items:center;gap:7px;color:#f4af78;font-size:9px;letter-spacing:.16em;font-weight:800}
.kicker-dot{display:inline-block;width:6px;height:6px;flex:0 0 auto;border-radius:50%;background:#ff8c4c;box-shadow:0 0 6px rgba(255,134,74,.4)}
.callout-sample{margin-left:auto;color:#a7b5b4;font-size:9px;letter-spacing:.09em;font-weight:700}
.incident-callout h2{margin:12px 0 1px;font-family:&quot;Space Grotesk&quot;,&quot;Inter&quot;,sans-serif;font-weight:650;font-size:18px;line-height:1.3;letter-spacing:-.02em}
.callout-id{color:#9caeae;font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.02em}
.callout-metadata{display:flex;align-items:center;gap:9px;margin-top:13px;color:#d7e0dd;font-size:11.5px;white-space:nowrap}
.callout-metadata strong{font-weight:750}
.meta-fire-dot{display:inline-block;width:7px;height:7px;margin-right:4px;background:#ff9150;border-radius:50%;box-shadow:0 0 9px #ff8149}
.metadata-divider{height:12px;width:1px;background:rgba(255,255,255,.21)}
.callout-link{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:13px;padding:10px 0 0;border:0;border-top:1px solid rgba(255,255,255,.11);background:none;color:#ffc491;text-align:left;font-size:11px;font-weight:700;transition:color .18s}
.callout-link:hover{color:#fff0e3}
.callout-link .icon{width:15px;height:15px}

/* ---------- Empty state ---------- */
.no-results{position:absolute;top:44%;left:50%;z-index:10;display:flex;align-items:center;gap:13px;transform:translate(-50%,-50%);padding:14px 16px;border:1px solid var(--line-strong);border-radius:14px;background:rgba(11,27,32,.94);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);color:#e0e9e7;max-width:min(430px,calc(100vw - 48px))}
.no-results-glyph{display:grid;place-items:center;flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,162,99,.35);background:radial-gradient(circle at 50% 42%,rgba(255,140,74,.22),rgba(255,140,74,.06) 70%);color:#ffbf92}
.no-results-glyph .icon{width:20px;height:20px}
.no-results-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.no-results-copy strong{font-size:12px;font-weight:750;color:#f2f5ef}
.no-results-copy small{font-size:10.5px;color:#9db1ad;line-height:1.35}
.no-results-reset{flex:0 0 auto;height:30px;padding:0 12px;border:1px solid rgba(255,178,122,.45);border-radius:7px;background:rgba(252,140,69,.12);color:#ffd3ae;font-size:10.5px;font-weight:750;transition:background .18s,color .18s}
.no-results-reset:hover{background:rgba(252,140,69,.24);color:#fff1e2}

/* ---------- Data banner (demo → backend lifecycle) ---------- */
.data-banner{position:absolute;top:18px;left:50%;z-index:56;display:flex;align-items:center;gap:9px;max-width:min(520px,calc(100vw - 32px));padding:8px 10px 8px 12px;border:1px solid;border-radius:11px;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:0 16px 44px rgba(0,0,0,.5);font-size:11.5px;font-weight:650;letter-spacing:.01em;transform:translate(-50%,-6px);animation:banner-in .35s var(--ease) forwards}
@keyframes banner-in{to{transform:translate(-50%,0)}}
.banner-text{line-height:1.35}
.banner-icon{width:15px;height:15px}
.banner-dismiss{display:grid;place-items:center;flex:0 0 auto;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:inherit;opacity:.75}
.banner-dismiss:hover{background:rgba(255,255,255,.09);opacity:1}
.banner-dismiss .icon{width:12px;height:12px}
.banner-spinner{display:none;width:14px;height:14px;flex:0 0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.22);border-top-color:#ffd9a8;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner-dot{display:none;width:7px;height:7px;flex:0 0 auto;border-radius:50%}
.data-banner.is-external{border-color:rgba(127,224,210,.42);background:linear-gradient(160deg,rgba(13,40,38,.96),rgba(8,24,29,.96));color:#cdf0e8}
.data-banner.is-external .banner-dot{display:inline-block;background:#6ee7ce;box-shadow:0 0 8px rgba(110,231,206,.7)}
.data-banner.is-external .banner-icon,.data-banner.is-external .banner-spinner{display:none}
.data-banner.is-error{border-color:rgba(255,150,110,.48);background:linear-gradient(160deg,rgba(56,25,16,.97),rgba(32,16,12,.97));color:#ffd9c4}
.data-banner.is-error .banner-dot{display:inline-block;background:#ff8f5e;box-shadow:0 0 8px rgba(255,143,94,.7)}
.data-banner.is-error .banner-spinner{display:none}
.data-banner.is-loading{border-color:rgba(233,222,196,.3);background:linear-gradient(160deg,rgba(32,34,30,.96),rgba(18,22,25,.96));color:#efe9d8}
.data-banner.is-loading .banner-spinner{display:inline-block}
.data-banner.is-loading .banner-icon,.data-banner.is-loading .banner-dot{display:none}

/* ---------- Floating controls (search + tool rail) ---------- */
.left-controls{position:absolute;top:24px;left:24px;z-index:23;width:278px}
.search-wrap{position:relative;height:46px;display:flex;align-items:center;background:rgba(9,21,27,.92);border:1px solid rgba(228,246,240,.18);border-radius:12px;backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:0 12px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .2s,box-shadow .2s}
.search-wrap:focus-within{border-color:rgba(127,224,210,.6);box-shadow:0 0 0 4px rgba(127,224,210,.10),0 12px 32px rgba(0,0,0,.32)}
.search-icon{position:absolute;left:14px;width:17px;height:17px;color:#8fa8a3;pointer-events:none}
#mapSearch{width:100%;height:100%;padding:0 42px 0 40px;border:0;background:transparent;color:#f2f6f0;font-size:12.5px;outline:none}
#mapSearch::placeholder{color:#7e9491}
#mapSearch::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search-key{position:absolute;right:12px;padding:2px 7px;border:1px solid rgba(255,255,255,.14);border-radius:5px;background:rgba(255,255,255,.04);color:#9db1ad;font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:10px}
.search-results{position:absolute;top:53px;left:0;right:0;z-index:28;overflow:hidden;border:1px solid rgba(226,243,237,.2);border-radius:12px;background:rgba(10,23,28,.98);box-shadow:0 18px 44px rgba(0,0,0,.6)}
.search-result{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid rgba(255,255,255,.06);background:transparent;text-align:left;color:#eef5f0;transition:background .15s}
.search-result:last-child{border-bottom:0}
.search-result:hover,.search-result:focus-visible{background:rgba(255,255,255,.08);outline:none}
.search-result&gt;.icon{color:#feaa70;width:16px;height:16px}
.search-result span{display:flex;flex-direction:column;gap:1px;min-width:0}
.search-result strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result small{color:#9db1ad;font-size:10px}
.search-empty{padding:13px;color:#a6b6b3;font-size:11px}
.tool-rail{width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:13px;padding:5px 4px;border:1px solid rgba(224,241,238,.18);border-radius:12px;background:rgba(9,21,27,.92);box-shadow:0 12px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.tool-button{position:relative;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:8px;background:none;color:#e4efec;transition:background .18s,color .18s}
.tool-button:hover,.tool-button.is-active{background:rgba(255,140,74,.15);color:#ffc18d}
.tool-button .icon{width:18px;height:18px}
.rail-rule{height:1px;width:26px;margin:3px 0;background:rgba(239,247,241,.15)}
.tool-button::after{content:attr(data-tooltip);position:absolute;left:51px;top:50%;transform:translateY(-50%) translateX(-4px);padding:6px 9px;border:1px solid rgba(255,255,255,.14);border-radius:6px;background:#10232a;color:#f4f7f5;white-space:nowrap;font-size:11px;font-weight:550;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.tool-button:hover::after,.tool-button:focus-visible::after{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0)}

/* ---------- Location chip &amp; north indicator ---------- */
.location-chip{position:absolute;top:24px;left:316px;z-index:20;min-width:225px;height:46px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid rgba(224,241,238,.16);border-radius:10px;background:rgba(10,23,29,.88);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.location-icon{color:#7ed2c8;display:grid;place-items:center}
.location-icon .icon{width:16px;height:16px}
.location-chip small{display:block;color:#91a5a3;font-size:8px;font-weight:750;letter-spacing:.13em}
.location-chip strong{display:block;margin-top:1px;color:#e6efeb;font-size:11px;font-weight:650;white-space:nowrap}
.north-chip{position:absolute;right:24px;bottom:56px;z-index:20;width:42px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:1px solid rgba(224,241,238,.2);border-radius:11px;background:rgba(9,21,27,.9);box-shadow:0 12px 32px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);color:#dcebe6;pointer-events:none}
.north-chip .icon{width:15px;height:15px;color:#ffd6a8;stroke-width:1.4}
.north-chip span{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.08em;color:#a9bcb8;line-height:1}

/* ---------- Drawer open button ---------- */
.drawer-open-button{position:absolute;top:24px;right:24px;z-index:24;display:flex;align-items:center;gap:9px;height:45px;padding:0 14px;border:1px solid rgba(234,245,239,.22);border-radius:10px;background:rgba(10,23,29,.95);box-shadow:0 12px 32px rgba(0,0,0,.4);color:#f1f6f1;font-size:12px;font-weight:700;transition:opacity .22s,transform .22s,border-color .2s}
.drawer-open-button:hover{border-color:rgba(255,174,111,.6)}
.drawer-open-button .icon{color:#ffae7a}
.drawer-open-button b{min-width:18px;height:18px;display:grid;place-items:center;border-radius:5px;background:rgba(252,134,70,.2);border:1px solid rgba(255,178,122,.4);color:#ffd0a5;font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:10px;font-weight:500;padding:0 4px}
.drawer-is-open .drawer-open-button{opacity:0;visibility:hidden;transform:translateY(-8px);pointer-events:none}

/* ---------- Overview card ---------- */
.overview{position:absolute;left:24px;bottom:24px;z-index:20;width:490px;padding:15px 18px 13px;border:1px solid rgba(228,246,240,.2);border-radius:14px;background:linear-gradient(150deg,rgba(14,30,32,.92),rgba(8,19,24,.93));box-shadow:0 20px 55px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);transition:width .25s var(--ease)}
.overview-head{display:flex;align-items:center;min-height:20px;gap:10px}
.overview-title{display:flex;align-items:center;gap:9px;color:#f2f5f1;font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.overview-glyph{display:flex;align-items:flex-end;gap:2px;width:18px;height:15px}
.overview-glyph i{display:block;width:3px;border-radius:2px 2px 0 0;background:#f5914f}
.overview-glyph i:nth-child(1){height:6px}
.overview-glyph i:nth-child(2){height:10px}
.overview-glyph i:nth-child(3){height:8px}
.overview-glyph i:nth-child(4){height:15px}
.overview-range{margin-left:auto;color:#90a6a4;font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:9px;white-space:nowrap}
.overview-collapse{width:24px;height:24px;display:grid;place-items:center;margin:-3px -4px -3px 2px;padding:0;border:0;border-radius:5px;background:transparent;color:#a0b4af;transition:background .15s,color .15s}
.overview-collapse:hover{background:rgba(255,255,255,.09);color:#fff}
.overview-collapse .icon{width:15px;height:15px;transition:transform .2s}
.metric-row{display:grid;grid-template-columns:1fr 1fr 1.06fr;margin-top:14px}
.metric{display:flex;flex-direction:column;min-width:0;padding:0 16px;border-right:1px solid rgba(230,241,235,.13)}
.metric:first-child{padding-left:0}
.metric:last-child{padding-right:0;border-right:0}
.metric strong{color:#f5f6f2;font-family:&quot;Space Grotesk&quot;,&quot;Inter&quot;,sans-serif;font-size:28px;line-height:1.02;letter-spacing:-.045em;font-weight:600;font-variant-numeric:tabular-nums}
.metric span{margin-top:5px;color:#a5b7b4;font-size:10px;white-space:nowrap}
.metric em{font-style:normal;font-size:9px;opacity:.8}
.overview-note{display:flex;align-items:center;gap:7px;margin-top:13px;color:#8fa6a2;font-size:10px;line-height:1.3}
.note-spark{width:5px;height:5px;flex:0 0 auto;border-radius:50%;background:#e6b985}
.overview.is-collapsed{width:245px;padding-bottom:15px}
.overview.is-collapsed .overview-body,.overview.is-collapsed .overview-range{display:none}
.overview.is-collapsed .overview-collapse{margin-left:auto}
.overview.is-collapsed .overview-collapse .icon{transform:rotate(180deg)}

/* ---------- Drawer ---------- */
.drawer{position:absolute;top:24px;right:24px;bottom:24px;z-index:26;width:var(--drawer-width);overflow:hidden;border:1px solid rgba(230,248,240,.26);border-radius:18px;background:linear-gradient(160deg,rgba(26,52,44,.72),rgba(12,32,32,.8) 46%,rgba(8,22,27,.84));box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 60px rgba(53,203,234,.05);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);transform:translateX(calc(100% + 40px));opacity:0;visibility:hidden;transition:transform .38s var(--ease),opacity .26s,visibility .26s}
.drawer-is-open .drawer{transform:translateX(0);opacity:1;visibility:visible}
.drawer-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:20px;scrollbar-width:thin;scrollbar-color:rgba(97,113,113,.45) transparent;background:linear-gradient(130deg,rgba(123,163,119,.06),transparent 42%,rgba(12,31,34,.18))}
.drawer-scroll::-webkit-scrollbar{width:5px}
.drawer-scroll::-webkit-scrollbar-thumb{background:rgba(98,118,118,.4);border-radius:10px}
.drawer-topline{display:flex;align-items:center;justify-content:space-between;height:22px}
.drawer-kicker,.detail-eyebrow{display:flex;align-items:center;gap:7px;color:#a5b9b4;font-size:9px;font-weight:800;letter-spacing:.15em;white-space:nowrap}
.drawer-kicker-mark{width:6px;height:6px;transform:rotate(45deg);background:#f6975b;border-radius:1px;box-shadow:0 0 10px rgba(250,146,84,.45)}
.icon-button{display:grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:rgba(255,255,255,.04);color:#a9bbb7;transition:background .15s,color .15s}
.icon-button:hover{background:rgba(255,255,255,.12);color:#fff}
.icon-button .icon{width:15px;height:15px}
.drawer-title{margin:9px 0 2px;font-family:&quot;Space Grotesk&quot;,&quot;Inter&quot;,sans-serif;font-size:22px;font-weight:680;letter-spacing:-.035em;line-height:1.26}
.drawer-description{margin:0;color:#99adab;font-size:11px;line-height:1.4}
.drawer-section{margin-top:14px}
.display-section{margin-top:15px}
.section-label{display:flex;align-items:center;gap:6px;color:#9caead;font-size:9px;font-weight:800;letter-spacing:.135em;line-height:1.3;white-space:nowrap}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.section-count{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;color:#35cbea;font-size:9px;white-space:nowrap}
.info-icon{width:13px;height:13px;flex:0 0 auto;color:#778e8c;stroke-width:1.8;cursor:help}
.segmented{display:flex;align-items:center;gap:3px;height:37px;margin-top:9px;padding:3px;border:1px solid rgba(228,241,237,.14);border-radius:8px;background:rgba(5,13,18,.45)}
.segment{height:29px;flex:1;min-width:0;padding:0 5px;border:0;border-radius:5px;background:none;color:#9fb3b0;font-size:10.5px;font-weight:650;white-space:nowrap;transition:background .2s,color .2s}
.segment:hover{color:#f8f4ea}
.segment.selected{background:linear-gradient(180deg,#ff9a5c,#e86a34);color:#1c1410;font-weight:750;box-shadow:0 3px 12px rgba(232,106,52,.4)}
.source-list{overflow:hidden;border:1px solid rgba(228,241,237,.14);border-radius:9px;background:rgba(255,255,255,.03)}
.source-row{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;cursor:pointer;transition:background .15s}
.source-row+.source-row{border-top:1px solid rgba(228,241,237,.09)}
.source-row:hover{background:rgba(255,255,255,.04)}
.source-symbol{display:grid;place-items:center;flex:0 0 auto;width:27px;height:27px;border-radius:6px}
.source-symbol .icon{width:15px;height:15px}
.viirs-symbol{background:rgba(104,205,193,.13);color:#75d8ca}
.modis-symbol{background:rgba(252,154,88,.14);color:#ffae71}
.extra-symbol{background:rgba(180,186,252,.13);color:#b9bffb}
.source-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.source-copy strong,.overlay-copy strong{color:#e4eee9;font-size:11px;line-height:1.15;font-weight:700}
.source-copy small,.overlay-copy small{color:#879b99;font-size:9px;line-height:1.3;white-space:nowrap}
.source-row input,.overlay-row input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toggle-track{position:relative;display:block;width:28px;height:16px;flex:0 0 auto;margin-left:auto;border:1px solid rgba(196,215,211,.28);border-radius:20px;background:#394c4c;transition:background .2s,border-color .2s}
.toggle-track::before{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#ced8d4;box-shadow:0 1px 2px rgba(0,0,0,.4);transition:transform .2s,background .2s}
.source-row input:checked+.toggle-track,.overlay-row input:checked+.toggle-track{border-color:#70c7b7;background:#63bca9}
.source-row input:checked+.toggle-track::before,.overlay-row input:checked+.toggle-track::before{transform:translateX(12px);background:#fff}
.source-row input:focus-visible+.toggle-track,.overlay-row input:focus-visible+.toggle-track{outline:2px solid var(--teal);outline-offset:3px}
.confidence-section{margin-top:14px}
.confidence-chips{display:flex;gap:5px;flex-wrap:nowrap}
.confidence-chip{min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;flex:1;height:32px;padding:0 5px;border:1px solid rgba(218,234,227,.16);border-radius:7px;background:rgba(255,255,255,.03);color:#b5c3bd;font-size:10px;font-weight:650;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.confidence-chip:hover{background:rgba(255,255,255,.09);color:#fff}
.confidence-chip.active{border-color:rgba(255,160,100,.6);background:rgba(252,140,69,.16);color:#ffe6cf}
.color-dot{display:inline-block;width:7px;height:7px;flex:0 0 auto;border-radius:50%}
.color-dot.high{background:#fc6549;box-shadow:0 0 7px rgba(252,101,73,.6)}
.color-dot.nominal{background:#ffad54;box-shadow:0 0 7px rgba(255,173,84,.45)}
.color-dot.low{background:#efcf7c;box-shadow:0 0 7px rgba(239,207,124,.4)}
.overlay-section{margin-top:14px}
.overlay-row{position:relative;display:flex;align-items:center;gap:10px;min-height:42px;margin-top:9px;padding:0 9px;border:1px solid rgba(228,241,237,.14);border-radius:8px;background:rgba(255,255,255,.03);cursor:pointer;transition:background .15s}
.overlay-row:hover{background:rgba(255,255,255,.06)}
.outline-symbol{display:block;width:24px;height:18px;flex:0 0 auto;border:1px dashed #f2a670;border-radius:50%;transform:rotate(-18deg);background:rgba(252,137,68,.07)}
.overlay-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.legend-card{margin-top:13px;padding:11px 12px;border:1px solid rgba(228,241,237,.13);border-radius:9px;background:rgba(193,219,208,.04)}
.legend-colors{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 9px}
.legend-colors&gt;span{display:inline-flex;align-items:center;gap:6px;color:#c4d1cc;font-size:10px;white-space:nowrap}
.legend-size{display:flex;align-items:center;gap:10px;padding-top:9px;border-top:1px solid rgba(226,241,233,.1);color:#a5b9b3;font-size:9px;white-space:nowrap}
.legend-circles{display:flex;align-items:center;gap:6px}
.legend-circles i{display:block;border-radius:50%;border:1px solid #ffb778;background:#fb8b50}
.legend-circles i:first-child{height:5px;width:5px}
.legend-circles i:last-child{height:10px;width:10px}
.legend-sep{color:#617776;margin:0 2px}
.advisory{display:flex;gap:8px;margin-top:11px;padding:9px 10px;border:1px solid rgba(117,191,183,.16);border-radius:8px;background:rgba(92,166,162,.07);color:#a9bfba;font-size:10px;line-height:1.4}
.advisory .icon{width:14px;height:14px;color:#88c7bd}
.advisory strong{color:#d7e6dd;font-weight:700}
.reset-filters{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:34px;margin-top:10px;border:1px solid rgba(228,241,237,.18);border-radius:8px;background:rgba(255,255,255,.04);color:#c5d2cf;font-size:10px;font-weight:700;transition:background .15s,color .15s}
.reset-filters:hover{background:rgba(255,255,255,.09);color:#fff}
.reset-filters .icon{width:13px;height:13px}

/* ---------- Detail view ---------- */
.detail-back{display:flex;align-items:center;gap:8px;padding:4px 0;border:0;background:none;color:#a9c5be;font-size:11px;font-weight:700;transition:color .15s}
.detail-back:hover{color:#fff}
.detail-back .icon{width:15px;height:15px}
.detail-eyebrow{margin-top:25px;color:#ffa974}
.detail-sample-pill{margin-left:auto;padding:3px 6px;border:1px solid rgba(255,166,99,.3);border-radius:4px;background:rgba(255,132,62,.12);color:#ffc794;font-size:8px;letter-spacing:.08em}
.detail-title{margin:10px 0 1px;font-family:&quot;Space Grotesk&quot;,&quot;Inter&quot;,sans-serif;font-size:24px;line-height:1.22;font-weight:670;letter-spacing:-.04em}
.detail-id{margin:0;color:#91a8a3;font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:10px}
.detail-metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.detail-metric-grid&gt;div{padding:13px 11px;border:1px solid rgba(232,243,238,.13);border-radius:9px;background:rgba(255,255,255,.04)}
.detail-metric-grid small{display:block;color:#90a8a2;font-size:8px;font-weight:800;letter-spacing:.08em}
.detail-metric-grid strong{display:block;margin-top:6px;color:#faf5ec;font-family:&quot;Space Grotesk&quot;,&quot;Inter&quot;,sans-serif;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-weight:600}
.detail-metric-grid em{font-style:normal;font-size:12px;letter-spacing:0;color:#aabdb6}
.detail-section{margin-top:22px}
.detail-section .section-label{margin-bottom:6px}
.detail-row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:38px;border-bottom:1px solid rgba(235,246,239,.09);color:#9cafaa;font-size:11px}
.detail-row strong{font-weight:650;color:#e2ece7;text-align:right;font-size:11px}
.detail-row .mono{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:10px}
.detail-warning{display:flex;gap:10px;margin-top:22px;padding:12px;border:1px solid rgba(241,162,95,.18);border-radius:9px;background:rgba(233,125,60,.07)}
.detail-warning .icon{width:15px;height:15px;color:#f8ae75}
.detail-warning p{margin:0;color:#c2c3b8;font-size:10px;line-height:1.55}
.detail-warning strong{color:#f8d2af}
.detail-primary,.detail-secondary{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;height:40px;margin-top:18px;border:1px solid #f49c62;border-radius:8px;background:#eb874e;color:#192021;font-size:11px;font-weight:800;transition:background .18s}
.detail-primary:hover{background:#ffae73}
.detail-primary .icon{width:16px;height:16px}
.detail-primary .end-icon{width:13px;height:13px;margin-left:auto}
.detail-secondary{margin-top:8px;border-color:rgba(228,241,237,.18);background:rgba(255,255,255,.04);color:#d2e0d9}
.detail-secondary:hover{background:rgba(255,255,255,.1)}
.detail-secondary .icon{width:14px;height:14px}

/* ---------- Attribution, scrim, toast ---------- */
.mobile-scrim{display:none}
.attribution{position:absolute;right:24px;bottom:6px;z-index:22;max-width:calc(100vw - 48px);color:rgba(229,238,232,.7);font-size:9px;line-height:1.35;text-shadow:0 1px 4px #000,0 1px 9px #000;text-align:right}
.attribution span{color:#f4ae79;margin:0 3px}
.toast{position:absolute;left:50%;top:64px;z-index:60;max-width:calc(100vw - 28px);padding:10px 15px;transform:translate(-50%,-10px);border:1px solid rgba(205,230,220,.22);border-radius:8px;background:rgba(12,30,31,.96);box-shadow:0 14px 30px rgba(0,0,0,.45);color:#ecf4ee;font-size:11px;font-weight:700;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s,transform .18s,visibility .18s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ---------- Entrance motion ---------- */
@keyframes ui-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.left-controls,.location-chip,.north-chip,.drawer-open-button,.overview{animation:ui-rise .7s var(--ease) both}
.location-chip{animation-delay:.06s}
.overview{animation-delay:.1s}
.drawer-open-button{animation-delay:.14s}
.north-chip{animation-delay:.18s}

/* ---------- Responsive ---------- */
@media(max-width:1180px){:root{--drawer-width:328px}.overview{width:450px}.metric{padding:0 13px}}
@media(max-width:1100px){.location-chip{display:none}}
@media(max-width:960px){:root{--drawer-width:316px}.overview{width:424px}.drawer-scroll{padding-left:16px;padding-right:16px}}
@media(max-width:760px){
  .left-controls{top:14px;left:14px;width:min(278px,calc(100vw - 84px))}
  .drawer-open-button{top:14px;right:14px}
  .north-chip{display:none}
  .overview{left:12px;right:12px;bottom:14px;width:auto;padding:11px 14px 11px}
  .metric strong{font-size:23px}
  .overview-note{font-size:9px}
  .drawer{top:auto;bottom:0;left:0;right:0;width:auto;max-height:78vh;border-radius:18px 18px 0 0;transform:translateY(105%);background:linear-gradient(160deg,rgba(27,54,46,.88),rgba(10,28,31,.94))}
  .drawer-is-open .drawer{transform:translateY(0)}
  .mobile-scrim{display:block;position:absolute;inset:0;z-index:25;background:rgba(4,12,16,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
  .drawer-is-open .mobile-scrim{opacity:1;visibility:visible}
  .attribution{right:12px;left:12px;bottom:4px;text-align:center;font-size:8px;max-width:none}
  .incident-callout{width:min(284px,calc(100vw - 48px))}
  .toast{top:64px}
  .data-banner{top:12px}
}
@media(max-height:700px) and (min-width:761px){.drawer{top:16px;bottom:16px}.overview{bottom:16px}.left-controls,.location-chip,.drawer-open-button,.north-chip{top:16px}.metric strong{font-size:24px}}
@media(max-width:470px){.overview-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric strong{font-size:21px}.metric span{font-size:8px}.no-results{flex-wrap:wrap}}
@media(max-width:370px){.incident-callout{width:238px}.overview-range{display:none}.metric{padding:0 8px}.overview-title{font-size:9px;letter-spacing:.05em}}

/* ---------- Reduced motion ---------- */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto !important;animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .callout-connector path{animation:none}
}


/* ---------- Coordinate readout (approx.) ---------- */
.coord-chip{position:absolute;left:50%;bottom:22px;z-index:20;display:none;transform:translateX(-50%);padding:8px 13px;border:1px solid rgba(219,240,233,.2);border-radius:var(--r-chip);background:rgba(9,21,27,.88);box-shadow:var(--shadow-chip);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.coord-text{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.03em;color:#b8c4c7;white-space:nowrap}

/* ---------- Inline scale bar (in attribution row) ---------- */
.attribution{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.scale-bar{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.scale-bar i{display:block;height:5px;min-width:24px;border:1.5px solid rgba(235,244,238,.75);border-top:0}
.scale-bar b{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:9px;font-weight:500;color:#dce8e4}
.attribution-sep{color:#f4ae79}

/* ---------- Detail: detection frequency histogram ---------- */
.histogram{display:flex;align-items:flex-end;gap:3px;height:56px;padding:10px 9px 0;border:1px solid rgba(219,240,233,.14);border-radius:var(--r-control);background:rgba(255,255,255,.025)}
.histogram i{flex:1;min-width:0;min-height:2px;border-radius:2px 2px 0 0;background:#ef8b4b;opacity:.9;transition:opacity .15s}
.histogram i:hover{opacity:1}
.histogram i.is-zero{background:rgba(255,255,255,.09)}
.histogram-axis{display:flex;justify-content:space-between;margin-top:5px;color:var(--soft);font-size:8px;letter-spacing:.08em}

/* ---------- Detail: per-detection list ---------- */
.detection-list{list-style:none;margin:0;padding:2px;max-height:212px;overflow-y:auto;border:1px solid rgba(219,240,233,.14);border-radius:var(--r-control);background:rgba(255,255,255,.025);scrollbar-width:thin;scrollbar-color:rgba(97,113,113,.45) transparent}
.detection-list::-webkit-scrollbar{width:4px}
.detection-list::-webkit-scrollbar-thumb{background:rgba(98,118,118,.4);border-radius:10px}
.detection-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-bottom:1px solid rgba(235,246,239,.07)}
.detection-item:last-child{border-bottom:0}
.detection-item:hover{background:rgba(255,255,255,.05)}
.detection-item .color-dot{width:8px;height:8px}
.det-source{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:9px;letter-spacing:.04em;color:#a9bab8;width:56px;flex:0 0 auto}
.det-frp{margin-left:auto;font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:9.5px;color:#ffd0a5;white-space:nowrap}
.det-time{color:#8ca1a1;font-size:9.5px;width:92px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.detection-more{margin:6px 2px 0;color:#8ca1a1;font-size:9px;text-align:right}

/* ---------- Mobile-only attribution inside drawer ---------- */
.drawer-attribution{display:none}

@media(min-width:1101px){.coord-chip{display:block}}

/* ---------- Mobile: attribution into the drawer, drop blur-heavy layers ---------- */
@media(max-width:760px){
  .attribution{display:none}
  .drawer-attribution{display:block;margin:16px 2px 0;padding-top:10px;border-top:1px solid rgba(219,240,233,.12);color:#8ca1a1;font-size:8.5px;line-height:1.55}
  .map-world{will-change:auto}
}

  function renderDetails(visible) {

    list.replaceChildren();

    const MAX_ROWS = 40;
    sorted.slice(0, MAX_ROWS).forEach(o =&gt; {
      const row = document.createElement('li');
      row.className = 'detection-item';
      row.innerHTML = \`&lt;i class=&quot;color-dot \${o.confidence}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span class=&quot;det-source&quot;&gt;\${escapeHtml(o.source)}&lt;/span&gt;&lt;span class=&quot;det-frp&quot;&gt;\${o.frp} MW&lt;/span&gt;&lt;span class=&quot;det-time&quot;&gt;\${dtfDay.format(o.ts)} · \${dtfTime.format(o.ts)}&lt;/span&gt;\`;

    // Trailing-72h frequency histogram, 6-hour buckets
    $('#detailObsCount').textContent = \`\${String(items.length).padStart(2, '0')} IN VIEW\`;
    const hist = $('#detailHistogram');
    hist.replaceChildren();
    const BUCKETS = 12;
    const bucketMs = WINDOW_MS / BUCKETS;
    const start = state.updatedAt - WINDOW_MS;
    const buckets = new Array(BUCKETS).fill(0);
    for (const o of items) {
      const idx = clamp(Math.floor((o.ts - start) / bucketMs), 0, BUCKETS - 1);
      buckets[idx] += 1;
    }
    const maxBucket = Math.max(...buckets, 1);
    buckets.forEach((n, i) =&gt; {
      const bar = document.createElement('i');
      bar.style.height = \`\${Math.max(5, Math.round((n / maxBucket) * 100))}%\`;
      bar.classList.toggle('is-zero', n === 0);
      bar.title = \`\${n} detection\${n === 1 ? '' : 's'} · \${(BUCKETS - i) * 6}–\${(BUCKETS - 1 - i) * 6}h ago\`;
      hist.appendChild(bar);
    });
  }

  /* ---------- Pan &amp; zoom (drag, wheel, pinch, double-tap) ---------- */
  const pointers = new Map();
  let pinch = null;
  let tapTimer = null, lastTap = { t: 0, x: 0, y: 0 };
  const midpoint = (a, b) =&gt; ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  stage.addEventListener('pointerdown', e =&gt; {
    if (e.button !== 0 &amp;&amp; e.pointerType !== 'touch') return;
    if (e.target.closest('.floating-ui, button, input, a')) return;
    clearTimeout(tapTimer);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      drag = null;
      stage.classList.remove('is-dragging');
      const [p1, p2] = [...pointers.values()];
      pinch = { startDist: Math.max(20, Math.hypot(p1.x - p2.x, p1.y - p2.y)), startZoom: state.zoom, prevMid: midpoint(p1, p2) };
      return;
    }
    if (pointers.size &gt; 2) return;
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY, moved: 0 };

  });
  stage.addEventListener('pointermove', e =&gt; {
    lastCursor = { x: e.clientX, y: e.clientY };

    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch &amp;&amp; pointers.size &gt;= 2) {
      const [p1, p2] = [...pointers.values()];
      const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      const mid = midpoint(p1, p2);
      zoomTo(pinch.startZoom * (dist / pinch.startDist), mid.x, mid.y);
      state.panX += mid.x - pinch.prevMid.x;
      state.panY += mid.y - pinch.prevMid.y;
      pinch.prevMid = mid;
      applyTransform();
      return;
    }
    if (!drag || drag.id !== e.pointerId) return;
    state.panX = drag.panX + e.clientX - drag.x;
    state.panY = drag.panY + e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
    applyTransform();
  });
  stage.addEventListener('pointerleave', () =&gt; { lastCursor = null; scheduleCoordUpdate(); });
  function endDrag(e) {
    pointers.delete(e.pointerId);
    if (pointers.size &lt; 2) pinch = null;
    const wasTapOnMap = drag &amp;&amp; drag.id === e.pointerId &amp;&amp; drag.moved &lt; 6;
    if (drag &amp;&amp; drag.id === e.pointerId) { drag = null; stage.classList.remove('is-dragging'); }
    if (!wasTapOnMap) return;
    const now = performance.now();
    const isDoubleTap = now - lastTap.t &lt; 300 &amp;&amp; Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) &lt; 28;
    if (isDoubleTap) {
      clearTimeout(tapTimer); // a double-tap zooms instead of deselecting
      zoomTo(state.zoom * 1.5, e.clientX, e.clientY);
      lastTap = { t: 0, x: 0, y: 0 };

  /* ============================================================
     Backend integration seam — see the contract at the top of this file.
     ============================================================ */
  const normalizeSource = (value) =&gt; {
    const v = String(value || '').trim().toUpperCase();
    if (!v) return 'UNKNOWN';
    if (v.includes('VIIRS')) return 'VIIRS';
    if (v.includes('MODIS')) return 'MODIS';
    return v; // kept, surfaced as its own toggle
  };
  const normalizeConfidence = (value) =&gt; {
    if (value == null) return 'low';
    // Numeric confidence (FIRMS VIIRS/MODIS 0–100) — FIRMS-style bands.
    const num = Number(typeof value === 'string' ? value.trim() : value);
    if (Number.isFinite(num) &amp;&amp; String(value).trim() !== '') {
      if (num &gt;= 80) return 'high';
      if (num &gt;= 30) return 'nominal';
      return 'low';
    }
    const v = String(value).trim().toLowerCase();
    if (['h', 'high'].includes(v)) return 'high';
    if (['n', 'nominal', 'medium', 'med', 'm'].includes(v)) return 'nominal';
    return 'low';
  };
  const parseTimestamp = (raw) =&gt; {
    if (raw == null) return NaN;
    const t = typeof raw === 'number' ? raw : Date.parse(raw);
    return Number.isFinite(t) ? t : NaN;
  };
  const parseFRP = (value) =&gt; {
    const n = Number(value);
    return Number.isFinite(n) ? clamp(n, 0, 9999) : 0;
  };
  const validX = (n) =&gt; Number.isFinite(n) &amp;&amp; n &gt;= 0 &amp;&amp; n &lt;= 1;

  function applyExternalPayload(payload) {
    // Clusters: id + name + on-map position are required; everything else is optional.
